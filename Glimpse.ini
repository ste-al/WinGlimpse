; Glimpse settings. Glimpse reloads this file when it changes, and the settings window writes to it.
; Encoding: UTF-8 (with or without BOM) or UTF-16. Comment lines start with ; or #.

[Glimpse]
; Guide, Assist or Strict
;   Guide:  feedback and X-ray only, never moves anything
;   Assist: small fixes after drops and new windows
;   Strict: also fixes moves made by apps and may shrink windows
Mode=Assist
; glimpse size in px at 100% scaling: Small 32, Medium 50, Large 72, or any value
GlimpseSize=50
; place new windows so every glimpse stays visible
PlaceNewWindows=1
; give a new window the size you last chose for that kind of window
RememberSizes=1
; automatic fixes cover this many recently used windows
MaxWindows=30
; auto follows the Windows display language; or en, de, cs, sk
Language=auto
; optional: start Glimpse when you sign in (1), per user, no admin rights needed
StartWithWindows=0
; Info or Debug (Debug also writes window titles to the log)
LogLevel=Info

[XRay]
Hotkey=Ctrl+Alt+Space
; TopLeft, TopRight, BottomLeft, BottomRight or Off
HotCorner=TopLeft
ShowMinimized=1

; never move these windows: ProcessN is a program file name, TitleN a title pattern
; (regular expression), for example Process1=teams.exe or Title1=^Calculator$
[Exclude]

; minimum sizes: rules are tried in number order, the first matching title wins
; px at 100% scaling, scaled per monitor (200 becomes 300 at 150%)
; example: TitleRegex=^Order #\d+  MinWidth=480  MinHeight=360  Note=ERP order forms
[MinSize1]
TitleRegex=.*
MinWidth=200
MinHeight=200
Note=every other window

[Experimental]
; a click on a background window's glimpse only activates it (uses a mouse hook)
FirstClickActivates=0
